server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 220M;
    index index.php;

    root /var/www/backend/public;

    # En-têtes de sécurité : posés par Laravel (App\Http\Middleware\SecurityHeaders)

    # Servir les fichiers archivés (download streaming)
    location /storage/archives/ {
        internal;                         # servi uniquement via X-Accel-Redirect
        alias /var/www/backend/storage/app/archives/;
    }

    # API Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
